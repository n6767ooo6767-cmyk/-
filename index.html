<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Копировать planet.bat</title>
</head>
<body>

  <button onclick="copyFileName()">Скопировать planet.bat</button>

  <script>
    function copyFileName() {
      navigator.clipboard.writeText("planet.bat");
    }
  </script>

</body>
</html>
