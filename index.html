<button onclick="downloadPlanet()">Скачать planet.bat</button>

<script>
function downloadPlanet() {
    const url = "https://raw.githubusercontent.com/n6767ooo6767-cmyk/-/main/planet.bat";

    const link = document.createElement("a");
    link.href = url;
    link.download = "planet.bat";
    document.body.appendChild(link);
    link.click();
    document.body.removeChild(link);
}
</script>
